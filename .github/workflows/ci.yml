name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pdf]"
      - name: pytest
        run: python -m pytest -q
      - name: ruff
        run: python -m ruff check --select F,E9 src tests
      - name: compileall
        run: python -m compileall -q src tests
      - name: cli version
        run: python -m sqa.cli --version

  golden:
    # 手动触发；需要仓库 secret TUSHARE_TOKEN
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pdf]"
      - name: golden
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python -m sqa.cli golden
